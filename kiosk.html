<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS — Gate Staff Kiosk</title><style>body{margin:0;background:#f7f4fa;font:16px Arial;color:#302540}header{background:#4b287d;color:white;padding:24px}h1{margin:0;font-size:24px}.wrap{max-width:1100px;margin:24px auto;padding:0 15px}.card{padding:22px;background:white;border:1px solid #ddd3ea;border-radius:14px;margin-bottom:18px}input,select,button{font:inherit;border:1px solid #cab9df;border-radius:8px;padding:10px}input,select{width:100%;box-sizing:border-box;margin:9px 0}button{background:#6630a6;color:white;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #eee;padding:12px 0}.notice{margin:10px 0;color:#74321a}.hide{display:none}.sub{color:#625772;font-size:13px}label{display:block;margin-top:12px}</style></head><body><header><h1>UPS Gate Staff Kiosk</h1><div>Student calling and verified collection</div></header><div class="wrap"><div id="message" class="notice"></div><section id="login" class="card"><h2>Gate Staff Sign-in</h2><p>Enter your assigned sign-in key.</p><label>Access key<input id="key" type="password" autocomplete="off" placeholder="Enter staff access key"></label><button id="signin">Sign in</button><p class="sub">Your Super Admin sets and updates this key. No email or username is required.</p></section><div id="app" class="hide"><section class="card"><div class="row"><h2>Call a Student</h2><button id="logout">Sign out</button></div><label>Class<select id="class"><option value="">All classes</option></select></label><label>Search student<input id="search" placeholder="Student name"></label><div id="students"></div></section><section class="card"><h2>Awaiting Pickup</h2><div id="pending"></div></section></div></div><script>
const URL='https://ysddttqkczmkvbcshizo.supabase.co/functions/v1/ups-gate-api';
const el=id=>document.getElementById(id);let token=sessionStorage.getItem('ups_gate_token')||'',students=[],pending=[],timer=null;
function message(s){el('message').textContent=s}
async function api(action,values={}){let res;try{res=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...values})})}catch{throw Error('Cannot reach the school server')}let data=await res.json();if(!res.ok||data.error)throw Error(data.error||'Request failed');return data}
function logged(state){el('login').classList.toggle('hide',state);el('app').classList.toggle('hide',!state)}
async function init(){try{const data=await api('students');students=data.students||[];const choice=el('class');choice.replaceChildren(new Option('All classes',''));const classes=new Map();students.forEach(s=>{const c=s.dismissal_classes;if(c)classes.set(s.class_id,{name:c.class_name,order:c.display_order})});[...classes].sort((a,b)=>a[1].order-b[1].order).forEach(([id,c])=>choice.add(new Option(c.name,id)));logged(true);renderStudents();await loadPending();clearInterval(timer);timer=setInterval(async()=>{try{await api('heartbeat');await loadPending()}catch(e){message(e.message);if(/Session expired|Sign in required/.test(e.message))logout(false)}},15000);message('')}catch(e){logout(false);message(e.message)}}
async function loadPending(){const r=await api('pending');pending=r.pending||[];renderPending();renderStudents()}
function renderStudents(){const select=el('class'),q=el('search').value.trim().toLowerCase();const matches=students.filter(s=>(!select.value||s.class_id===select.value)&&s.full_name.toLowerCase().includes(q)).slice(0,100);const box=el('students');box.replaceChildren();for(const s of matches){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=s.full_name;const b=document.createElement('button');b.textContent=pending.some(x=>x.student_id===s.id)?'Called':'CALL';b.disabled=pending.some(x=>x.student_id===s.id);b.onclick=async()=>{b.disabled=true;try{await api('call',{student_id:s.id});await loadPending();message('Student called')}catch(e){message(e.message);b.disabled=false}};row.append(name,b);box.append(row)}}
function renderPending(){const box=el('pending');box.replaceChildren();for(const s of pending){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=s.student_name_snapshot+' — '+s.class_name_snapshot;const b=document.createElement('button');b.textContent='PICKED UP';b.onclick=async()=>{if(!confirm('Confirm the student has been handed to the authorized adult?'))return;b.disabled=true;try{await api('pickup',{request_id:s.id});await loadPending();message('Pickup confirmed')}catch(e){message(e.message);b.disabled=false}};row.append(name,b);box.append(row)}}
async function logout(callServer=true){clearInterval(timer);if(callServer&&token){try{await api('logout')}catch{}}token='';sessionStorage.removeItem('ups_gate_token');logged(false)}
el('signin').onclick=async()=>{let key=el('key').value;el('key').value='';if(!key)return message('Enter your access key');try{const result=await api('login',{key});token=result.token;sessionStorage.setItem('ups_gate_token',token);await init()}catch(e){message(e.message)}};el('key').addEventListener('keydown',e=>{if(e.key==='Enter')el('signin').click()});el('logout').onclick=()=>logout();el('search').oninput=renderStudents;el('class').onchange=renderStudents;if(token)init();else logged(false);
</script></body></html>
