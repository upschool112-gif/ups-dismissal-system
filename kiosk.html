<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS — Gate Staff</title><style>
:root{font-family:Arial,sans-serif;color:#302743;background:#f6f4fa}*{box-sizing:border-box}body{margin:0}header{background:#4d287d;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:22px;margin:0}header small{color:#e6d9f3}.container{padding:20px;max-width:1700px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}.card{background:white;border:1px solid #ded6e8;border-radius:14px;padding:20px;box-shadow:0 3px 12px #35215309}.sidebar{position:sticky;top:16px;max-height:calc(100vh - 110px);overflow:auto}.headerline{display:flex;align-items:center;justify-content:space-between;gap:8px}.headerline h2{margin:0 0 12px;font-size:20px}.btn{cursor:pointer;border:0;border-radius:9px;background:#63359a;color:white;padding:11px 15px;font:inherit}.btn.light{background:#eee7f7;color:#4d287d}.btn.warn{background:#a12c4a}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{background:#faf8fd;color:#312748;border:1px solid #ded6ea;border-radius:12px;padding:19px 12px;min-height:90px;text-align:center;cursor:pointer;font-weight:700;overflow-wrap:anywhere}.tile:hover,.tile:focus{border-color:#7449a6;background:#f1eafa}.tile.called{border-color:#b78a39;background:#fff7e6}.tile small{display:block;margin-top:8px;font-weight:400;color:#786d85}.back{margin-bottom:14px}.search{width:100%;border:1px solid #cfc3db;border-radius:9px;padding:12px;font:inherit;margin:6px 0 16px}.call{padding:13px 0;border-bottom:1px solid #ece7f1}.call strong{display:block;margin-bottom:4px}.call small{color:#746983}.call button{margin:9px 6px 0 0;padding:8px 10px;font-size:13px}.count{background:#eee5fa;border-radius:40px;padding:5px 10px;color:#4d287d;font-size:13px}.muted{color:#756b80}.hide{display:none!important}#message{min-height:24px;color:#86294c;margin:0 0 12px}#login{max-width:460px;margin:50px auto}label{display:block;margin-bottom:8px}#key{width:100%;padding:13px;border:1px solid #cfc3db;border-radius:9px;font:inherit;margin-bottom:14px}dialog{border:0;border-radius:16px;box-shadow:0 25px 80px #190d3c55;padding:25px;width:min(440px,calc(100vw - 30px))}dialog::backdrop{background:#180c2e88}dialog h3{margin-top:0}dialog .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:24px}@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 300px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:740px){.layout{grid-template-columns:1fr}.sidebar{position:relative;max-height:none;order:-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:15px}.container{padding:12px}}

/* UPS purple gate-button theme */
.btn,.tile{transition:background .15s ease,border-color .15s ease,transform .12s ease,box-shadow .15s ease}
.btn{background:#64339c;color:#fff;border:1px solid #64339c;font-weight:700;box-shadow:0 2px 5px #4223651c}
.btn:hover:not(:disabled){background:#4e247f;border-color:#4e247f}
.btn.light{background:#eee5f8;color:#552a87;border:1px solid #baa3d6}
.btn.light:hover:not(:disabled){background:#ded0f2}
.btn.warn{background:#8050b3;color:white;border-color:#8050b3}
.btn.warn:hover:not(:disabled){background:#653595}
.tile{background:#f1eafa;color:#4d287e;border:2px solid #b89bd7;box-shadow:0 2px 6px #4b287d0b}
.tile:hover,.tile:focus-visible{background:#e0d1f2;border-color:#67359c;transform:translateY(-1px);box-shadow:0 4px 11px #4b287d21}
.tile.called{background:#e6d9f5;border-color:#6d3c9e;color:#4d287e}
.tile.called small{color:#693999;font-weight:700}
.btn:focus-visible,.tile:focus-visible{outline:3px solid #b596e3;outline-offset:2px}

/* UPS polished kiosk: desktop two-thirds selection / one-third live queue */
.layout{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:22px;align-items:start}
.layout>main.card{min-width:0;border:1px solid #e4daee;box-shadow:0 10px 32px rgba(55,28,89,.08)}
.sidebar{position:sticky;top:16px;background:linear-gradient(156deg,#65349b 0%,#4b247f 49%,#371764 100%);border:1px solid #7f58af;color:#fff;box-shadow:0 16px 36px rgba(64,26,104,.26);max-height:calc(100vh - 110px);min-height:360px}
.sidebar h2{color:#fff;letter-spacing:.15px}.sidebar .muted,.sidebar .call small{color:#e8d9fa!important}.sidebar .count{background:#ffffff24;color:#fff;border:1px solid #ffffff50;font-weight:800}
.sidebar .call{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.24);border-radius:12px;padding:13px 14px;margin:0 0 12px;box-shadow:0 5px 12px #210e421b}
.sidebar .call strong{color:#fff;font-size:15px}.sidebar .call button{border-radius:8px;box-shadow:0 4px 0 rgba(33,14,60,.5)}
.sidebar .call .btn.light{background:linear-gradient(180deg,#f8f4ff,#dfcdf5);color:#4c2577;border:1px solid #fff}
.sidebar .call .btn:not(.light){background:linear-gradient(180deg,#a46bdf,#7640b8);color:white;border:1px solid #c098ee}
.btn{background:linear-gradient(180deg,#9660d6 0%,#7139b1 57%,#542785 100%);border:1px solid #5d2c94;color:#fff;box-shadow:0 4px 0 #3d1c68,0 7px 12px #3f216c21;font-weight:700}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#a776e5,#8146c3 58%,#602c98);border-color:#5d2c94;transform:translateY(-1px);box-shadow:0 5px 0 #3d1c68,0 9px 14px #3f216c27}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #3d1c68,0 2px 5px #3f216c2d}
.btn.light{background:linear-gradient(180deg,#f8f5fd,#e4d9f4);color:#502c81;border:1px solid #bda7d8;box-shadow:0 3px 0 #a18abf,0 5px 9px #3f216c18}
.btn.light:hover:not(:disabled){background:linear-gradient(180deg,#fff,#dccdf1);border-color:#a88bc9;box-shadow:0 4px 0 #a18abf,0 7px 12px #3f216c18}
.btn.warn{background:linear-gradient(180deg,#9d61d4,#7336ab);border-color:#7441a2;box-shadow:0 4px 0 #432066}
.tile{background:linear-gradient(165deg,#b48be2 0%,#925dcd 44%,#703bab 100%);border:1px solid #70409c;color:#fff;box-shadow:0 5px 0 #51277f,0 9px 16px #4d287d2e;text-shadow:0 1px 1px #43246f44;min-height:104px}
.tile small{color:#f4eaff;text-shadow:none}
.tile:hover,.tile:focus-visible{background:linear-gradient(165deg,#c5a0ef,#a672df 45%,#7e44bd);color:#fff;border-color:#613191;transform:translateY(-2px);box-shadow:0 7px 0 #51277f,0 12px 17px #4d287d31}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #51277f,0 3px 7px #4d287d1c}
.tile.called{background:linear-gradient(160deg,#7846b3,#552986);border:2px solid #e3c4ff;color:#fff;box-shadow:0 5px 0 #361a5e,0 8px 15px #4d287d30}
.tile.called small{color:#f4dfff}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,2fr) minmax(270px,1fr)}}
@media(max-width:740px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto;max-height:none;min-height:unset;order:-1}}
@media(prefers-reduced-motion:reduce){.btn,.tile{transition:none}}
.search-label{display:block;font-size:13px;font-weight:700;color:#5a3286;margin:6px 0 2px}.search:focus{outline:3px solid #c9afe6;outline-offset:1px}.tile small{overflow-wrap:anywhere}\n</style></head><body><header><div><small>UNIVERSAL PHILIPPINES SCHOOL • AL AIN</small><h1>Student Dismissal — Gate Staff</h1></div><button class="btn light hide" id="logout">Sign out</button></header><div class="container"><div id="message" role="status"></div><section id="login" class="card"><h2>Gate Staff Sign-in</h2><label for="key">Access key</label><input id="key" type="password" autocomplete="off" placeholder="Enter your assigned key"><button class="btn" id="signin">Sign in</button></section><div id="workspace" class="layout hide"><main class="card"><div class="headerline"><h2 id="title">Select a Class</h2><button id="back" class="btn light hide">← All Classes</button></div><p id="hint" class="muted">Select a class below to view its students.</p><label for="search" class="search-label">Search students</label><input class="search" id="search" type="search" autocomplete="off" placeholder="Search all students by name or select a class"><div class="grid" id="tiles"></div></main><aside class="card sidebar"><div class="headerline"><h2>Currently Called</h2><span id="count" class="count">0</span></div><p class="muted" style="font-size:13px">This list stays visible while navigating classes.</p><div id="pending"></div></aside></div></div><dialog id="dialog"><h3 id="dialogTitle"></h3><p id="dialogText"></p><div class="actions" id="dialogActions"></div></dialog>
<script>
const URL='https://ysddttqkczmkvbcshizo.supabase.co/functions/v1/ups-gate-api';const el=id=>document.getElementById(id);let token=sessionStorage.getItem('ups_gate_token')||'',students=[],pending=[],classes=[],selected=null,timer=null,busy=false;
const msg=t=>el('message').textContent=t;
async function api(action,params={}){let response;try{response=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...params})})}catch{throw Error('Server connection unavailable')}const result=await response.json();if(!response.ok||result.error)throw Error(result.error||'Unable to complete request');return result}
function showApp(active){el('login').classList.toggle('hide',active);el('workspace').classList.toggle('hide',!active);el('logout').classList.toggle('hide',!active)}
function modal(title,description,actions){const dlg=el('dialog');el('dialogTitle').textContent=title;el('dialogText').textContent=description;const bar=el('dialogActions');bar.replaceChildren();for(const a of actions){const b=document.createElement('button');b.className='btn '+(a.type||'');b.textContent=a.label;b.onclick=()=>{dlg.close();if(a.run)a.run()};bar.append(b)}dlg.showModal()}
async function refresh(){const r=await api('pending');pending=r.pending||[];renderCalls();renderTiles()}
async function start(){try{const r=await api('students');students=r.students||[];const map=new Map();for(const s of students){const c=s.dismissal_classes;if(c)map.set(s.class_id,{id:s.class_id,name:c.class_name,order:c.display_order})}classes=[...map.values()].sort((a,b)=>a.order-b.order);showApp(true);await refresh();clearInterval(timer);timer=setInterval(async()=>{try{await api('heartbeat');await refresh()}catch(e){msg(e.message);if(/Session expired|Sign in required/.test(e.message))signout(false)}},15000);msg('')}catch(e){await signout(false);msg(e.message)}}
function renderTiles(){const box=el('tiles');box.replaceChildren();el('back').classList.toggle('hide',!selected);const q=el('search').value.trim().toLowerCase();el('title').textContent=selected?classes.find(c=>c.id===selected)?.name||'Students':q?'Student Search Results':'Select a Class';el('hint').textContent=q?'Search results include students across all classes. Select a student to call or manage a current call.':selected?'Select a student to call or manage an active call.':'Select a class to open the student list, or search the entire school.';if(!selected&&!q){for(const c of classes){const b=document.createElement('button');b.className='tile';b.textContent=c.name;const count=document.createElement('small');count.textContent=students.filter(s=>s.class_id===c.id).length+' students';b.append(count);b.onclick=()=>{selected=c.id;el('search').value='';renderTiles()};box.append(b)}return}
for(const s of students.filter(s=>(!selected||s.class_id===selected)&&(!q||s.full_name.toLowerCase().includes(q))).sort((a,b)=>a.full_name.localeCompare(b.full_name))){const call=pending.find(x=>x.student_id===s.id),b=document.createElement('button');b.className='tile'+(call?' called':'');b.textContent=s.full_name;if(!selected){const badge=document.createElement('small');badge.textContent=classes.find(c=>c.id===s.class_id)?.name||'Class unavailable';b.append(badge)}if(call){const tag=document.createElement('small');tag.textContent='● Currently called';b.append(tag)}b.onclick=()=>call?manage(call):modal('Call Student?',s.full_name+' — Are you sure you want to call this student?',[{label:'Go Back',type:'light'},{label:'Call Student',run:()=>transaction('call',{student_id:s.id},'Student called')}]);box.append(b)}}
function renderCalls(){const box=el('pending');box.replaceChildren();el('count').textContent=pending.length;if(!pending.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='No students currently being called.';box.append(empty);return}for(const r of pending){const row=document.createElement('div');row.className='call';const n=document.createElement('strong');n.textContent=r.student_name_snapshot;const c=document.createElement('small');c.textContent=r.class_name_snapshot;const buttons=document.createElement('div');const cancel=document.createElement('button');cancel.className='btn light';cancel.textContent='Cancel Call';cancel.onclick=()=>confirmCancel(r);const pick=document.createElement('button');pick.className='btn';pick.textContent='Picked Up';pick.onclick=()=>confirmPickup(r);buttons.append(cancel,pick);row.append(n,c,buttons);box.append(row)}}
function confirmCancel(r){modal('Confirm Cancellation','Cancel the call for '+r.student_name_snapshot+'?',[{label:'Keep Call',type:'light'},{label:'Yes, Cancel Call',type:'warn',run:()=>transaction('cancel',{request_id:r.id},'Call cancelled')}])}
function confirmPickup(r){modal('Confirm Pickup','Confirm that '+r.student_name_snapshot+' was handed over to the authorized adult.',[{label:'Go Back',type:'light'},{label:'Confirm Picked Up',run:()=>transaction('pickup',{request_id:r.id},'Pickup confirmed')}])}
function manage(r){modal(r.student_name_snapshot,r.class_name_snapshot+' — Select an action for this currently called student.',[{label:'Go Back',type:'light'},{label:'Cancel Call',type:'warn',run:()=>confirmCancel(r)},{label:'Picked Up',run:()=>confirmPickup(r)}])}
async function transaction(action,params,success){if(busy)return;busy=true;try{await api(action,params);await refresh();msg(success)}catch(e){msg(e.message)}finally{busy=false}}
async function signout(revoke=true){clearInterval(timer);if(revoke&&token){try{await api('logout')}catch{}}token='';sessionStorage.removeItem('ups_gate_token');selected=null;showApp(false)}
el('signin').onclick=async()=>{const key=el('key').value;el('key').value='';if(!key)return msg('Enter the access key');try{const r=await api('login',{key});token=r.token;sessionStorage.setItem('ups_gate_token',token);await start()}catch(e){msg(e.message)}};
el('key').onkeydown=e=>{if(e.key==='Enter')el('signin').click()};el('logout').onclick=()=>signout();el('back').onclick=()=>{selected=null;el('search').value='';renderTiles()};el('search').oninput=renderTiles;if(token)start();else showApp(false);
</script></body></html>
