<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS — Gate Kiosk</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4fa;color:#28243b;font:16px Arial,sans-serif}header{background:#4c2782;color:#fff;padding:22px}h1{margin:0;font-size:24px}.wrap{max-width:1080px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ded8e9;border-radius:14px;padding:20px;margin-bottom:20px}label{display:block;font-weight:bold;margin:12px 0 5px}input,select,button{font:inherit;padding:11px;border:1px solid #cfc6df;border-radius:8px}input,select{width:100%}button{cursor:pointer;background:#60339a;color:#fff;border-color:#60339a}button:disabled{opacity:.5}button.alt{background:#fff;color:#452274}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;border-top:1px solid #e7e2ed;padding:13px 0;flex-wrap:wrap}.muted{color:#6e6578}#main{display:none}.buttons{display:flex;gap:8px;flex-wrap:wrap}#msg{white-space:pre-wrap;margin-bottom:12px}small{color:#daccef}</style></head><body><header><h1>UPS Gate Staff Kiosk</h1><small>Authorized staff only • Calling and verified pickup</small></header><div class="wrap"><div id="msg" role="status"></div><section class="card" id="login"><h2>UPS-Gate Login</h2><p>Enter your assigned credentials. A personal email is not required at the kiosk.</p><label>Username</label><input id="username" value="UPS-Gate" readonly><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="signin" style="margin-top:14px">Sign in</button><p class="muted">The password is never embedded in this page.</p></section><div id="main"><section class="card"><div class="buttons" style="justify-content:space-between"><h2>Call a Student</h2><button class="alt" id="logout">Sign out</button></div><label>Class</label><select id="class"></select><label>Search by student name</label><input id="search" placeholder="Type a student name"><div id="students"></div></section><section class="card"><h2>Awaiting Pickup</h2><div id="pending"></div></section></div></div>
<script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.75.1';const URL='https://ysddttqkczmkvbcshizo.supabase.co',KEY='REPLACE_WITH_PUBLIC_PUBLISHABLE_KEY';// This email is an internal Auth identifier, not an additional human-operated mailbox. Provision it using Supabase Auth Admin before use.
const GATE_AUTH_EMAIL='ups@gmail.com';const el=id=>document.getElementById(id),message=m=>el('msg').textContent=m;let db=null,students=[],current=[],heartbeat=null;
if(KEY.startsWith('REPLACE_')||GATE_AUTH_EMAIL.startsWith('REPLACE_'))message('Setup required: configure the public publishable key and internal Gate Auth email.');else {db=createClient(URL,KEY);}
async function verify(){if(!db)return false;const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data:staff}=await db.from('dismissal_staff').select('role,is_active,username').eq('user_id',user.id).maybeSingle();return !!(staff&&staff.role==='gate_staff'&&staff.is_active&&staff.username?.toLowerCase()==='ups-gate');}
async function init(){const valid=await verify();el('login').style.display=valid?'none':'block';el('main').style.display=valid?'block':'none';if(!valid)return;await load();heartbeat&&clearInterval(heartbeat);await ping();heartbeat=setInterval(ping,20000);}
async function ping(){if(!db)return;const {data:{user}}=await db.auth.getUser();if(!user)return;await db.from('dismissal_gate_presence').upsert({user_id:user.id,last_seen_at:new Date().toISOString()},{onConflict:'user_id'});}
async function load(){const [cs,ss,rs]=await Promise.all([db.from('dismissal_classes').select('id,class_name').eq('is_active',true).order('display_order'),db.from('dismissal_students').select('id,full_name,class_id').eq('enrollment_status','active').order('full_name'),db.from('dismissal_requests').select('id,student_id,student_name_snapshot,class_name_snapshot,called_at').eq('status','called').order('called_at')]);if(cs.error||ss.error||rs.error){message('Could not load data: '+(cs.error||ss.error||rs.error).message);return;}students=ss.data;current=rs.data;const select=el('class'),prev=select.value;select.replaceChildren(new Option('All classes',''));cs.data.forEach(c=>select.add(new Option(c.class_name,c.id)));select.value=prev||'';render();}
function render(){const box=el('students');box.replaceChildren();const q=el('search').value.toLowerCase(),cls=el('class').value;for(const s of students.filter(x=>(!cls||x.class_id===cls)&&x.full_name.toLowerCase().includes(q)).slice(0,100)){const row=document.createElement('div');row.className='row';const name=document.createElement('strong');name.textContent=s.full_name;const btn=document.createElement('button');btn.textContent=current.some(r=>r.student_id===s.id)?'Already called':'CALL';btn.disabled=current.some(r=>r.student_id===s.id);btn.onclick=async()=>{btn.disabled=true;const {error}=await db.rpc('dismissal_call_student',{p_student_id:s.id});message(error?'Call failed: '+error.message:'Student called.');await load();};row.append(name,btn);box.append(row);}const waiting=el('pending');waiting.replaceChildren();for(const r of current){const row=document.createElement('div');row.className='row';const name=document.createElement('div');name.textContent=r.student_name_snapshot+' — '+r.class_name_snapshot;const b=document.createElement('button');b.textContent='PICKED UP';b.onclick=async()=>{if(!confirm('Confirm verified handover of '+r.student_name_snapshot+'?'))return;b.disabled=true;const {error}=await db.rpc('dismissal_finish_request',{p_request_id:r.id,p_action:'picked_up',p_reason:null});message(error?'Could not confirm: '+error.message:'Pickup confirmed.');await load();};row.append(name,b);waiting.append(row);}}
el('signin').onclick=async()=>{if(!db)return;const pw=el('password').value;if(!pw){message('Enter the Gate Staff password.');return;}const {error}=await db.auth.signInWithPassword({email:GATE_AUTH_EMAIL,password:pw});el('password').value='';if(error){message('Login failed. Verify the account credentials.');return;}if(!await verify()){await db.auth.signOut();message('This account does not have Gate Staff permission.');return;}message('');await init();};el('logout').onclick=async()=>{heartbeat&&clearInterval(heartbeat);await db.auth.signOut();await init();};el('search').addEventListener('input',render);el('class').addEventListener('change',render);if(db){init();setInterval(()=>{if(el('main').style.display==='block')load()},12000);}
</script></body></html>
