<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS — Proceed to the Gate</title><style>*{box-sizing:border-box}body{margin:0;background:#11203d;color:#fff;font-family:Arial,sans-serif}header{padding:22px 35px;background:#192b50;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(26px,4vw,55px);margin:0}small{color:#b9c9e7}.live{color:#9ef5be}main{padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.student{background:#243961;padding:22px;border-radius:16px;border-left:7px solid #b1d5ff}.student strong{font-size:clamp(24px,3vw,40px);display:block;word-break:break-word}.student span{color:#cbdbf9;font-size:20px}.student time{display:block;margin-top:14px;color:#b6c5e4}.empty{text-align:center;grid-column:1/-1;padding:90px 20px;font-size:30px;color:#b9c9e7}footer{padding:12px 30px;color:#b9c9e7}#error{color:#ffb4b4}@media(max-width:480px){header{padding:16px}main{padding:16px}}</style></head><body><header><div><small>UNIVERSAL PHILIPPINES SCHOOL • AL AIN</small><h1>PROCEED TO THE GATE</h1></div><div class="live" id="state">● CONNECTING</div></header><main id="calls"><div class="empty">Loading active calls…</div></main><footer id="error"></footer>
<script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.75.1';
const URL='https://ysddttqkczmkvbcshizo.supabase.co';const KEY='sb_publishable_-lg213GVOhubZ-YXYAmapw_UcVKI8Ah';const calls=document.getElementById('calls'),state=document.getElementById('state'),error=document.getElementById('error');
const fmt=t=>new Intl.DateTimeFormat('en-AE',{timeZone:'Asia/Dubai',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(t));
if(KEY.startsWith('REPLACE_')){calls.textContent='Awaiting public publishable key configuration.';state.textContent='● SETUP NEEDED';}else{const db=createClient(URL,KEY);let busy=false;async function refresh(){if(busy)return;busy=true;const {data,error:e}=await db.from('dismissal_public_calls').select('request_id,student_name,class_name,called_at').order('called_at',{ascending:true}).limit(300);busy=false;if(e){error.textContent='Connection unavailable; retrying…';state.textContent='● RECONNECTING';return;}error.textContent='';state.textContent='● LIVE';calls.replaceChildren();if(!data.length){const x=document.createElement('div');x.className='empty';x.textContent='No students currently being called';calls.append(x);return;}for(const r of data){const card=document.createElement('article');card.className='student';const name=document.createElement('strong'),cls=document.createElement('span'),time=document.createElement('time');name.textContent=r.student_name;cls.textContent=r.class_name;time.textContent='Called '+fmt(r.called_at);card.append(name,cls,time);calls.append(card);}}await refresh();db.channel('dismissal-public-board').on('postgres_changes',{event:'*',schema:'public',table:'dismissal_public_calls'},refresh).subscribe();setInterval(refresh,15000);}
</script></body></html>
