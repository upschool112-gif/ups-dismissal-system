<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS Student Dismissal System</title><link rel="icon" href="ups-logo.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f6f2fa;color:#312344}header{background:linear-gradient(125deg,#7134a2,#462079);color:white;display:flex;align-items:center;justify-content:space-between;padding:16px 3%;gap:20px;box-shadow:0 5px 20px #38195728}.identity{display:flex;align-items:center;gap:16px}.logo{height:66px;width:66px;border-radius:50%;background:white;padding:3px;object-fit:contain}h1{margin:0;font-size:clamp(21px,2.4vw,30px)}header p{margin:5px 0 0;color:#eee3ff;font-size:13px}.home{max-width:1130px;margin:7vh auto;padding:18px}.intro{text-align:center;margin-bottom:36px}.intro h2{font-size:clamp(25px,3vw,38px);margin:0 0 12px}.intro p{color:#685b77}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.option{cursor:pointer;background:white;border:1px solid #e5daee;border-radius:18px;padding:30px 20px;text-align:left;min-height:200px;box-shadow:0 12px 24px #3f1d7812;transition:transform .14s,box-shadow .14s}.option:hover,.option:focus-visible{transform:translateY(-4px);border-color:#ac81cf;box-shadow:0 16px 30px #4b247d29}.option strong{display:block;font-size:23px;color:#4e247d;margin:12px 0}.option span{color:#756680;font-size:15px;line-height:1.5}#app{display:none;height:calc(100vh - 92px);min-height:580px}#app iframe{display:block;border:0;width:100%;height:100%;background:white}#back{background:#fff;border:0;border-radius:10px;color:#57268d;padding:11px 16px;cursor:pointer;font-weight:700;font-size:14px;display:none}#name{font-size:13px;color:#f0e2ff}@media(max-width:760px){.grid{grid-template-columns:1fr}.option{min-height:130px}.logo{height:49px;width:49px}header{padding:13px}.home{margin:2vh auto}#app{height:calc(100dvh - 80px)}}

/* Formal UPS navigation with raised purple gradient */
.option{background:linear-gradient(155deg,#a97adf 0%,#8651c1 42%,#5b2d96 100%);border:1px solid #592b8e;color:#fff;box-shadow:0 7px 0 #3c1b66,0 14px 25px rgba(52,22,92,.25),inset 0 1px 0 #ffffff6b;text-align:left;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.option strong{color:#fff;font-size:23px;text-shadow:0 1px 2px #37175c66}.option span{color:#f1e6fc;font-size:15px}.option:hover,.option:focus-visible{transform:translateY(-3px);border-color:#ae86dd;filter:brightness(1.07);box-shadow:0 10px 0 #3c1b66,0 17px 30px rgba(52,22,92,.32),inset 0 1px 0 #ffffff80}.option:active{transform:translateY(5px);box-shadow:0 2px 0 #3c1b66,0 6px 12px rgba(52,22,92,.2)}.option:focus-visible{outline:3px solid #ddc8f5;outline-offset:4px}@media(prefers-reduced-motion:reduce){.option{transition:none}}
</style></head><body><header><div class="identity"><img class="logo" src="ups-logo.svg" alt="UPS logo"><div><h1>UPS Student Dismissal System</h1><p>Universal Philippines School · Al Ain <span id="name"></span></p></div></div><button id="back" type="button">← Main Menu</button></header>
<main id="home" class="home"><div class="intro"><h2>Student Dismissal Management</h2><p>Access the designated modules of the UPS Student Dismissal System.</p></div><div class="grid">
<button class="option" data-page="display.html" data-name="Classroom Display"><strong>Classroom Display</strong><span>View real-time student dismissal announcements for classroom coordination.</span></button>
<button class="option" data-page="kiosk.html" data-name="Gate Staff"><strong>Gate Staff</strong><span>Manage student dismissal calls and verify student pickup using the authorized staff access key.</span></button>
<button class="option" data-page="admin.html" data-name="Monitoring"><strong>Monitoring</strong><span>Access authorized dismissal monitoring, student records, reports, and administrative settings.</span></button>
</div></main><section id="app" aria-label="Selected UPS application"><iframe id="panel" title="UPS application" loading="eager" referrerpolicy="same-origin"></iframe></section>
<script>
const routes={display:"display.html",gate:"kiosk.html",monitoring:"admin.html"};
const home=document.getElementById("home"),app=document.getElementById("app"),frame=document.getElementById("panel"),back=document.getElementById("back"),name=document.getElementById("name");
function openPage(key,push=true){const path=routes[key];if(!path){home.style.display="block";app.style.display="none";back.style.display="none";name.textContent="";frame.removeAttribute("src");if(push)history.pushState(null,"",location.pathname);return}home.style.display="none";app.style.display="block";back.style.display="block";name.textContent=" · "+({display:"Classroom Display",gate:"Gate Staff",monitoring:"Monitoring"}[key]);if(frame.getAttribute("src")!==path)frame.src=path;if(push)history.pushState({key},"",location.pathname+"?view="+key)}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>openPage(b.dataset.page==="display.html"?"display":b.dataset.page==="kiosk.html"?"gate":"monitoring"));
back.onclick=()=>openPage(null);onpopstate=()=>openPage(new URLSearchParams(location.search).get("view"),false);openPage(new URLSearchParams(location.search).get("view"),false);
</script></body></html>
